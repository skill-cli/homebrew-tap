name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  homebrew:
    permissions:
      contents: read
    uses: agents-tools/github-workflows/.github/workflows/homebrew.yml@bb0a8c8c39827a364b9d3cbf4069754e7d975586
    with:
      tap: skill-cli/tap
