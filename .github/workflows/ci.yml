name: CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  homebrew:
    permissions:
      contents: read
    uses: agents-tools/github-workflows/.github/workflows/homebrew.yml@2ce48fb8834304acf010fa1b47a05db6148ab6c4
    with:
      tap: skill-cli/tap
